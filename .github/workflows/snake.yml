name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jelendu
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#D97757&color_dots=#EFE3D3,#E5C6A8,#D97757,#B4552D,#7A4526
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#3A2E23,#7A4526,#B4552D,#D97757,#E5B896

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
